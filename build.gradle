plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            ideName = "NeoForge ${it.name.capitalize()}"
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly "maven.modrinth:sable:${sable_modrinth_version}"
    runtimeOnly "maven.modrinth:sable:${sable_modrinth_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neoforge_version_range: neoforge_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description,
        aeronautics_version_range: aeronautics_version_range,
        sable_version_range: sable_version_range,
        create_version_range: create_version_range
    ]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') { expand replacements }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
