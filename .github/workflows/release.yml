name: Build and publish Rocket Engine release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: rocket-engine-release-${{ github.ref }}
  queue: max

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build mod JAR
        run: ./gradlew build --no-daemon

      - name: Publish JAR to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/rocketengine-*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one rocketengine JAR, found ${#jars[@]}" >&2
            exit 1
          fi

          tag="auto-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          version="$(basename "${jars[0]}")"
          version="${version#rocketengine-}"
          version="${version%.jar}"
          title="Rocket Engine ${version} — build ${GITHUB_RUN_NUMBER}"
          notes="Automated Java 21 build from commit ${GITHUB_SHA} on ${GITHUB_REF_NAME}."

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refreshing its JAR asset."
            gh release upload "$tag" "${jars[@]}" --clobber
          else
            gh release create "$tag" "${jars[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
